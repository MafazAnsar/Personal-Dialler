name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files are complete
        run: |
          for f in $(find app/src -name '*.kt'); do
            o=$(tr -cd '{' < "$f" | wc -c)
            c=$(tr -cd '}' < "$f" | wc -c)
            if [ "$o" != "$c" ]; then
              echo "::error file=$f::Looks cut off or damaged ($o open vs $c close braces). Re-upload this file."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Configure app signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE is missing. Add the base64-encoded keystore as a repository Actions secret."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/debug.keystore

      - name: Build signed debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD must all be configured as repository Actions secrets."
            exit 1
          fi
          gradle assembleDebug --no-daemon \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: PersonalDialer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
