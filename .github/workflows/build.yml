name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files are complete
        run: |
          for f in $(find app/src -name '*.kt'); do
            o=$(tr -cd '{' < "$f" | wc -c)
            c=$(tr -cd '}' < "$f" | wc -c)
            if [ "$o" != "$c" ]; then
              echo "::error file=$f::Looks cut off or damaged ($o open vs $c close braces). Re-upload this file."
              exit 1
            fi
          done
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::Repository secret RELEASE_KEYSTORE is missing. See README.md, section Signing key."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > app/debug.keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleDebug --no-daemon
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "File size and checksum (compare with the file you downloaded):"
          ls -l "$APK"
          sha256sum "$APK"
          echo "Signature check:"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "Package details:"
          "$BT/aapt2" dump badging "$APK" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalDialer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
