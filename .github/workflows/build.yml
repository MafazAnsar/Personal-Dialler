name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files are complete
        run: |
          for f in $(find app/src -name '*.kt'); do
            o=$(tr -cd '{' < "$f" | wc -c)
            c=$(tr -cd '}' < "$f" | wc -c)
            if [ "$o" != "$c" ]; then
              echo "::error file=$f::Looks cut off or damaged ($o open vs $c close braces). Re-upload this file."
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalDialer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
